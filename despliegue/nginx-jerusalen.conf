# Ejemplo de nginx para los tres dominios. La API sirve el ERP y, para adminj.*, el panel del dueño.
# Si se usa un túnel (Cloudflare u otro), apuntar erpj y adminj a http://127.0.0.1:3100 y omitir nginx.

server {
  listen 443 ssl http2;
  server_name erpj.cerice360.com adminj.cerice360.com;
  # ssl_certificate / ssl_certificate_key: los de cerice360.com
  client_max_body_size 4m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header Strict-Transport-Security "max-age=31536000" always;
  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# jerusalen2: la demo de referencia (jerusalen-sistema) tal cual, en su propio contenedor (puerto 3000)
server {
  listen 443 ssl http2;
  server_name jerusalen2.cerice360.com;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
